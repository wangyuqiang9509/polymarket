version: 1
name: btc_5m_impulse_momentum_profiles
market: polymarket_btc_updown_5m

strategy_reference:
  style: momentum_follow_through_into_close
  entry_window_seconds_left_target: 120
  entry_window_seconds_left_tolerance: 30
  btc_move_usd_min: 70
  btc_move_usd_max_reference: 100
  skew_bias_note: "Prefer direction supported by market skew when momentum is already established."
  sizing_note: "Fixed $5 per ticket. No 5→10→30 ladder. Skip stronger-side ask >= 0.85; after 3 wins skip ask >= 0.80. Do not fade the cheap side."
  optional_hedge_note: "When skew is extreme (for example >=95/5), allow a small opposite hedge to reduce last-second reversal risk."

shared_rules:
  market_validation:
    require_active: true
    require_not_closed: true
    require_end_in_future_sec_min: 5
    candidate_slots: ["prev", "current", "next", "next2"]
    choose: "closest_valid"
  heartbeat:
    enabled: true
    max_stale_sec: 15
    check_interval_sec: 5
    fail_action: "skip"
  execution_safety:
    skip_if_quote_stale_sec_gt: 8
    skip_if_dns_or_api_errors_consecutive: 3
    skip_if_spread_gt: 0.03
    skip_if_top_ask_notional_usd_lt: 30
  session_timing:
    monitor_continuous: true
    min_entry_seconds_left: 90
    max_entry_seconds_left: 150
    exit_before_sec: 20

profiles:
  conservative:
    description: "More stable mode: stricter filters and lower per-trade risk."
    signal:
      trigger_source: "clob_best_ask"
      direction_rule: "follow_stronger_side_over_threshold"
      threshold_price: 0.70
      max_ask: 0.85
      expensive_ask: 0.80
      expensive_after_wins: 3
    sizing:
      stake_mode: "fixed_or_cap"
      stake_usd: 5
      risk_per_trade_pct_equity: 8
      max_notional_usd: 8
      daily_max_loss_pct: 10
      max_trades_per_day: 12
      ladder: false
    hedge:
      enabled: true
      trigger_side_price_gte: 0.95
      trigger_seconds_left_lte: 45
      hedge_share_of_main_pct: 3
      hedge_notional_usd_min: 1
      hedge_notional_usd_max: 2
    stop_loss:
      enabled: true
      stop_loss_pct_from_entry: 0.25
      trigger_source: "clob_best_bid_primary"
      clob_sl_min_bid: 0.45
      clob_cut_bid: 0.40
      early_flatten_sec: 45
      early_flatten_bid: 0.55
      exit_before_sec: 20

  aggressive:
    description: "Higher frequency and higher risk mode."
    signal:
      trigger_source: "clob_best_ask"
      direction_rule: "follow_stronger_side_over_threshold"
      threshold_price: 0.70
      max_ask: 0.85
      expensive_ask: 0.80
      expensive_after_wins: 3
    sizing:
      stake_mode: "fixed_or_cap"
      stake_usd: 5
      risk_per_trade_pct_equity: 15
      max_notional_usd: 15
      daily_max_loss_pct: 15
      max_trades_per_day: 20
      ladder: false
    hedge:
      enabled: true
      trigger_side_price_gte: 0.93
      trigger_seconds_left_lte: 50
      hedge_share_of_main_pct: 5
      hedge_notional_usd_min: 1
      hedge_notional_usd_max: 3
    stop_loss:
      enabled: true
      stop_loss_pct_from_entry: 0.30
      trigger_source: "clob_best_bid_primary"
      clob_sl_min_bid: 0.45
      clob_cut_bid: 0.40
      early_flatten_sec: 45
      early_flatten_bid: 0.55
      exit_before_sec: 20

runner_mapping:
  script: "skills/btc-5m-live/scripts/test_btc_5m_session_exit_sl.py"
  direct_flags_now_supported:
    - "--threshold"
    - "--stake-usd"
    - "--stop-loss-pct"
    - "--exit-before-sec"
    - "--early-flatten-sec"
    - "--early-flatten-bid"
    - "--clob-sl-min-bid"
    - "--min-entry-seconds-left"
    - "--max-entry-seconds-left"
    - "--entry-timeout-min"
    - "--poll-sec"
    - "--execute"
  example_conservative_now: ".venv/bin/python scripts/test_btc_5m_session_exit_sl.py --threshold 0.70 --stake-usd 5 --stop-loss-pct 0.25 --exit-before-sec 20 --early-flatten-sec 45 --min-entry-seconds-left 90 --max-entry-seconds-left 150 --entry-timeout-min 60 --poll-sec 5 --execute"
  example_aggressive_now: ".venv/bin/python scripts/test_btc_5m_session_exit_sl.py --threshold 0.70 --stake-usd 5 --stop-loss-pct 0.30 --exit-before-sec 20 --early-flatten-sec 45 --min-entry-seconds-left 90 --max-entry-seconds-left 150 --entry-timeout-min 60 --poll-sec 5 --execute"

notes:
  - "Current 5m runner uses threshold/side-strength logic; impulse filter integration can be extended at strategy layer."
  - "Entry behavior: wait until 90-150s remain (~120s ± 30s); if stronger-side CLOB ask >= 0.70, enter that side. Skip earlier and later."
  - "Stop-loss: CLOB bid vs entry*0.75 while bid >= 0.45; Gamma 25% only if a salvage bid remains; flatten live non-winners at 45s left; hold winners at 20s."
  - "Floor 0.05-0.40 confirms with the same book's best ask <= 0.50 first, Gamma <= 0.50 second (Gamma lagged 0.49-0.86 on unsold Sep 17/18 losers). Resting GTC salvage orders are cancelled before each FAK retry."
  - "CLOB stop band reaches the 0.05 floor (ask/Gamma <= 0.50 confirms below 0.45); cuts need 2 consecutive polls; 1s polling in the last 90s; Gamma stop off unless --gamma-sl; dead book on close -> buy the opposite token (hedge_max_ask 0.95)."
